plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
    compileOnly "net.runelite:client:$runeLiteVersion"
    compileOnly "org.projectlombok:lombok:1.18.36"
    annotationProcessor "org.projectlombok:lombok:1.18.36"

    testImplementation "junit:junit:4.12"
    testImplementation "org.mockito:mockito-core:4.11.0"
    testImplementation "net.runelite:client:$runeLiteVersion"
    testImplementation "net.runelite:jshell:$runeLiteVersion"
    testImplementation 'ch.qos.logback:logback-classic:1.2.9'

    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'com.squareup.okhttp3:okhttp:4.12.0'
}

group = 'com.osrsai'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    if (System.getProperty('java.awt.headless') != null) {
        systemProperty 'java.awt.headless', System.getProperty('java.awt.headless')
    }
}

tasks.register('run', JavaExec) {
    group = 'runelite'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.osrsai.OsrsAiPluginTest'
    args = ['--developer-mode']
    jvmArgs = [
            '-ea',
            '--add-opens=java.desktop/sun.awt=ALL-UNNAMED',
            '--add-opens=java.base/java.text=ALL-UNNAMED',
            '--add-opens=java.desktop/java.awt.peer=ALL-UNNAMED',
            '--add-opens=java.desktop/sun.awt.windows=ALL-UNNAMED'
    ]
}
